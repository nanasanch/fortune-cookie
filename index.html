<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Infinite Fortune Cookie</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 430px;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .cookie-button {
      position: absolute;
      left: 31%;
      top: 66%;
      width: 38%;
      height: 14%;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    .cookie-button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="page">

    <img
      src="12a79145-02c7-48f8-87ce-a85e67ed2592.png"
      alt="The Infinite Fortune Cookie"
      class="hero-image"
    >

    <button
      class="cookie-button"
      onclick="revealFortune()"
      aria-label="Reveal your fortune"
    ></button>

  </div>

  <script>
    function revealFortune() {
      alert("Your fortune is coming next...");
    }
  </script>

</body>
</html>
