<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Infinite Fortune Cookie</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .cookie-button {
      position: absolute;
      left: 30%;
      top: 62%;
      width: 40%;
      height: 18%;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    .cookie-button:active {
      transform: scale(0.96);
    }

    .fortune-card {
      position: absolute;
      left: 50%;
      top: 68%;
      transform: translate(-50%, -50%) scale(0.9);

      width: 72%;
      max-width: 310px;

      background: #f5e6c8;
      color: #1b1b1b;

      padding: 20px 18px;
      box-sizing: border-box;

      text-align: center;
      font-family: Georgia, serif;

      border-radius: 4px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.55);

      opacity: 0;
      pointer-events: none;

      transition: all 0.35s ease;

      z-index: 20;
    }

    .fortune-card.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .fortune-title {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .fortune-text {
      font-size: 18px;
      line-height: 1.45;
    }
  </style>
</head>

<body>

  <div class="page">

    <img
      src="fortune.png"
      alt="The Infinite Fortune Cookie"
      class="hero-image"
    >

    <button
      class="cookie-button"
      onclick="revealFortune()"
      aria-label="Reveal your fortune">
    </button>

    <div class="fortune-card" id="fortuneCard">
      <div class="fortune-title">Your Fortune</div>
      <div class="fortune-text" id="fortuneText">
        Something wonderful is coming your way.
      </div>
    </div>

  </div>

  <script>
    function revealFortune() {
      document.getElementById("fortuneCard").classList.add("show");
    }
  </script>

</body>

</html>
