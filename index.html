  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .cookie-button {
      position: absolute;
      left: 30%;
      top: 61%;
      width: 40%;
      height: 16%;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    .cookie-button:active {
      transform: scale(0.97);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      pointer-events: none;
      transition: background 0.35s ease;
      z-index: 15;
    }

    .overlay.show {
      background: rgba(0,0,0,0.42);
      pointer-events: auto;
    }

    .fortune-card {
      position: absolute;
      left: 50%;
      top: 66%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 74%;
      max-width: 320px;
      background: #f4e4c4;
      color: #171717;
      padding: 22px 22px 20px;
      box-sizing: border-box;
      text-align: center;
      border-radius: 4px;
      box-shadow: 0 12px 38px rgba(0,0,0,0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 20;
      cursor: pointer;
    }

    .fortune-card.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .fortune-title {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .fortune-title::before,
    .fortune-title::after {
      content: "";
      display: inline-block;
      width: 28px;
      height: 1px;
      background: #262626;
      vertical-align: middle;
      margin: 0 7px;
    }

    .fortune-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.35;
      white-space: pre-line;
    }

    .fortune-heart {
      margin-top: 12px;
      font-size: 22px;
    }

    .tap-again {
      margin-top: 12px;
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.55;
    }
  </style>
</head>

<body>

  <div class="page">

    <img

    >

    <button

    </button>

    <div

    item = array[Math.floor(Math.random() * array.length)];
  } while (item === lastFortune && array.length > 1);

  lastFortune = item;

  return item;
}


function revealFortune() {

  const roll = Math.random() * 100;

  let fortune;
  let title;

  /*
      PROBABILITIES

      Normal       84%
      Rare          8%
      Mission       4%
      Redeemable    3%
      Ultra Rare    1%
  */

  if (roll < 1) {

    fortune = getRandomItem(ultraRareFortunes);
    title = "✦ Ultra Rare ✦";

  }

  else if (roll < 9) {

    fortune = getRandomItem(rareFortunes);
    title = "★ Rare Fortune ★";

  }

  else if (roll < 13) {

    fortune = getRandomItem(missions);
    title = "★ Secret Mission ★";

  }

  else if (roll < 16) {

    fortune = getRandomItem(redeemables);
    title = "Redeemable";

  }

  else {

    fortune = getRandomItem(normalFortunes);
    title = "Your Fortune";

  }


  document.getElementById("fortuneTitle").textContent = title;
  document.getElementById("fortuneText").textContent = fortune;

  document.getElementById("overlay").classList.add("show");
  document.getElementById("fortuneCard").classList.add("show");
}


function closeFortune() {

  document.getElementById("overlay").classList.remove("show");
  document.getElementById("fortuneCard").classList.remove("show");

}


document.addEventListener("keydown", function(event) {

  if (event.key === "Escape") {
    closeFortune();
  }

});

</script>
